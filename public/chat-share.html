<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"/>
<title>Поделённый чат — FernieX</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{--bg:#07070f;--text:#ffffff;--t2:rgba(255,255,255,.55);--t3:rgba(255,255,255,.3);
  --c1:#4285f4;--c5:#a855f7;--font:'Outfit',sans-serif;}
html,body{min-height:100%;background:var(--bg);font-family:var(--font);color:var(--text);}
body{padding:0;display:flex;flex-direction:column;align-items:center;}

.topbar{width:100%;max-width:760px;padding:18px 20px;display:flex;align-items:center;justify-content:space-between;}
.brand{display:flex;align-items:center;gap:8px;font-weight:700;font-size:15px;color:#fff;letter-spacing:-.2px;}
.brand .dot{width:8px;height:8px;border-radius:50%;background:linear-gradient(135deg,var(--c1),var(--c5));}
.cta{padding:9px 16px;border-radius:100px;background:linear-gradient(135deg,var(--c1),var(--c5));color:#fff;text-decoration:none;font-size:13px;font-weight:600;box-shadow:0 4px 18px rgba(66,133,244,.35);}

.head{width:100%;max-width:760px;padding:8px 20px 20px;text-align:center;}
.head h1{font-size:clamp(20px,3vw,26px);font-weight:600;letter-spacing:-.2px;margin-bottom:6px;}
.head .sub{font-size:12.5px;color:var(--t3);}

.msgs{width:100%;max-width:760px;padding:8px 20px 60px;display:flex;flex-direction:column;gap:20px;}
.msg-u{align-self:flex-end;max-width:78%;padding:13px 17px;background:rgba(66,133,244,.13);border:1px solid rgba(66,133,244,.18);border-radius:18px 18px 4px 18px;font-size:15px;line-height:1.6;white-space:pre-wrap;}
.msg-ai{align-self:flex-start;max-width:92%;display:flex;gap:12px;align-items:flex-start;}
.msg-ai-ico{width:26px;height:26px;flex-shrink:0;margin-top:3px;}
.msg-ai-ico svg{width:100%;height:100%;filter:drop-shadow(0 0 6px rgba(66,133,244,.35));}
.msg-ai-txt{font-size:15px;line-height:1.7;min-width:0;word-break:break-word;}
.msg-ai-txt p{margin:0 0 8px;}
.msg-ai-txt img{max-width:320px;width:100%;border-radius:14px;border:1px solid rgba(255,255,255,.1);display:block;margin-bottom:8px;}

.state{width:100%;max-width:480px;margin:80px auto;text-align:center;padding:0 20px;}
.state .ico{font-size:34px;margin-bottom:14px;}
.state h2{font-size:18px;font-weight:700;margin-bottom:8px;}
.state p{font-size:13.5px;color:var(--t2);line-height:1.6;}
.spinner{width:30px;height:30px;border-radius:50%;border:3px solid rgba(255,255,255,.12);border-top-color:var(--c1);animation:spin .8s linear infinite;margin:0 auto 16px;}
@keyframes spin{to{transform:rotate(360deg)}}

.ai-file-list{display:flex;flex-direction:column;gap:8px;margin-top:10px;padding-top:10px;border-top:1px solid rgba(255,255,255,.07);}
.ai-file-card{display:flex;align-items:center;gap:12px;padding:11px 14px;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.08);border-radius:16px;max-width:380px;width:100%;}
.ai-file-icon{width:38px;height:38px;flex-shrink:0;}
.ai-file-info{flex:1;min-width:0;}
.ai-file-name{font-size:13px;font-weight:600;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.ai-file-size{font-size:11px;color:rgba(255,255,255,.35);margin-top:2px;}
.ai-file-dl{padding:7px 14px;background:linear-gradient(135deg,var(--c1),var(--c5));border:none;border-radius:9px;font-family:var(--font);font-size:12px;font-weight:700;color:#fff;cursor:pointer;white-space:nowrap;flex-shrink:0;}
.ai-file-dl:hover{opacity:.85;}

pre{margin:10px 0;padding:14px 16px;overflow-x:auto;background:rgba(0,0,0,.35);border:1px solid rgba(255,255,255,.08);border-radius:12px;font-family:'JetBrains Mono',monospace;font-size:13px;line-height:1.6;}
code{font-family:'JetBrains Mono',monospace;}
.msg-ai-txt code:not(pre code){background:rgba(255,255,255,.1);padding:2px 6px;border-radius:5px;font-size:13px;color:#a5f3fc;}
blockquote{border-left:3px solid var(--c1);padding-left:10px;margin:6px 0;color:rgba(255,255,255,.6);font-style:italic;}
a{color:var(--c1);}
</style>
</head>
<body>

<div class="topbar">
  <div class="brand"><span class="dot"></span>FernieX</div>
  <a class="cta" href="/" target="_blank" rel="noopener">Открыть FernieX →</a>
</div>

<div id="root"></div>

<script>
function escH(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}

function renderMd(raw){
  raw=String(raw||'').replace(/<thinking>[\s\S]*?<\/thinking>/gi,'').trim();
  const cb=[];
  raw=raw.replace(/```(\w*)\n?([\s\S]*?)```/g,(_,lang,code)=>{
    const i=cb.length;
    cb.push(`<pre><code>${escH(code.trim())}</code></pre>`);
    return `%%CB${i}%%`;
  });
  raw=raw
    .replace(/^### (.+)$/gm,'<h3 style="font-size:14px;font-weight:700;margin:12px 0 4px;color:#fff">$1</h3>')
    .replace(/^## (.+)$/gm,'<h2 style="font-size:16px;font-weight:700;margin:14px 0 5px;color:#fff">$1</h2>')
    .replace(/^# (.+)$/gm,'<h1 style="font-size:18px;font-weight:700;margin:16px 0 6px;color:#fff">$1</h1>')
    .replace(/\*\*(.+?)\*\*/g,'<strong style="color:#fff">$1</strong>')
    .replace(/\*(.+?)\*/g,'<em>$1</em>')
    .replace(/`([^`\n]+)`/g,'<code>$1</code>')
    .replace(/\[([^\]]+)\]\(([^)]+)\)/g,'<a href="$2" target="_blank" rel="noopener">$1</a>')
    .replace(/^> (.+)$/gm,'<blockquote>$1</blockquote>')
    .replace(/^---+$/gm,'<hr style="border:none;border-top:1px solid rgba(255,255,255,.1);margin:10px 0">')
    .replace(/^\d+\.\s(.+)$/gm,'<li style="margin:1px 0;padding-left:4px">$1</li>')
    .replace(/^[-*]\s(.+)$/gm,'<li style="margin:1px 0;list-style:disc;padding-left:4px">$1</li>')
    .replace(/(<li[\s\S]*?<\/li>(\n|$))+/g,m=>`<ul style="padding-left:18px;margin:4px 0">${m}</ul>`);
  raw=raw.split(/\n{2,}/).map(p=>{
    p=p.trim();
    if(!p||p.startsWith('<'))return p;
    return `<p>${p.replace(/\n/g,'<br>')}</p>`;
  }).join('');
  cb.forEach((b,i)=>raw=raw.replace(`%%CB${i}%%`,b));
  return raw;
}

const _FILE_COLORS={js:'#f7df1e,#c9a800',ts:'#3178c6,#1a5fa8',py:'#3572a5,#f5dc50',html:'#e34c26,#f06529',css:'#264de4,#2965f1',json:'#4ade80,#16a34a',md:'#9ca3af,#6b7280',txt:'#d1d5db,#9ca3af'};
function fileIconSvg(ext){
  const e=(ext||'txt').toLowerCase();
  const [c1,c2]=(_FILE_COLORS[e]||'#94a3b8,#64748b').split(',');
  const label=e.slice(0,4).toUpperCase();
  return `<svg width="38" height="38" viewBox="0 0 38 38"><defs><linearGradient id="fg_${e}" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="${c1}"/><stop offset="100%" stop-color="${c2}"/></linearGradient></defs><rect width="38" height="38" rx="11" fill="url(#fg_${e})" opacity=".2"/><path d="M10 8h12l7 7v15a2 2 0 0 1-2 2H10a2 2 0 0 1-2-2V10a2 2 0 0 1 2-2z" fill="${c1}" opacity=".9"/><path d="M22 8l7 7h-5a2 2 0 0 1-2-2z" fill="${c2}"/><text x="19" y="27" text-anchor="middle" font-family="monospace" font-size="7" font-weight="800" fill="#fff">${label}</text></svg>`;
}
function fmtBytes(n){if(n<1024)return n+' Б';if(n<1048576)return(n/1024).toFixed(1)+' КБ';return(n/1048576).toFixed(2)+' МБ';}

window._sharedFiles={};
function parseFiles(text){
  if(/\/f-x_ai_createfile\s*\n/i.test(text)&&!/\/f-x_ai_createfile_finish/i.test(text)){
    text=text.replace(/\s*$/,'')+'\n/f-x_ai_createfile_finish';
  }
  const re=/\/f-x_ai_createfile\s*\n([\s\S]*?)\/f-x_ai_createfile_finish/gi;
  if(!re.test(text))return null;
  re.lastIndex=0;
  const parts=[];let lastIdx=0;let m;
  while((m=re.exec(text))!==null){
    const before=text.slice(lastIdx,m.index).trim();
    if(before)parts.push({type:'text',content:before});
    const block=m[1];
    const extM=block.match(/^Расширение:\s*\.?(\w+)/im);
    const ext=extM?extM[1].toLowerCase():'txt';
    const nameM=block.match(/^Имя:\s*(.+)/im);
    const fileName=nameM?nameM[1].trim():`file_${Date.now()}.${ext}`;
    let content=block.replace(/^Расширение:.*\n?/im,'').replace(/^Имя:.*\n?/im,'').replace(/^Содержимое:\s*\n?/im,'').trim();
    parts.push({type:'file',ext,fileName,content});
    lastIdx=m.index+m[0].length;
  }
  const after=text.slice(lastIdx).trim();
  if(after)parts.push({type:'text',content:after});
  return parts;
}
function renderAiContent(raw){
  const imgMarkerMatch=raw.match(/^\[\[IMG:(.+?)\]\]\r?\n?/);
  if(imgMarkerMatch){
    const imgUrl=imgMarkerMatch[1].trim();
    const rest=raw.slice(imgMarkerMatch[0].length).trim();
    return `<img src="${escH(imgUrl)}" alt="" loading="lazy" onerror="this.style.display='none'">`+(rest?renderMd(rest):'');
  }
  const imgResultMatch=raw.match(/^\/imgresult\s+(https?:\/\/\S+)\s+(.*)/s);
  if(imgResultMatch){
    const [,url,prompt]=imgResultMatch;
    return `<div style="font-size:12px;color:rgba(255,255,255,.4);margin-bottom:6px;">🎨 ${escH(prompt)}</div><img src="${escH(url)}" alt="" loading="lazy">`;
  }
  const parts=parseFiles(raw);
  if(!parts)return renderMd(raw);
  let textParts='',fileCards='';
  parts.forEach(p=>{
    if(p.type==='text'){textParts+=p.content+'\n\n';}
    else{
      const bytes=new TextEncoder().encode(p.content).length;
      const id='fc_'+btoa(unescape(encodeURIComponent(p.fileName))).slice(0,12).replace(/[^a-z0-9]/gi,'x');
      window._sharedFiles[id]={fileName:p.fileName,content:p.content,ext:p.ext};
      fileCards+=`<div class="ai-file-card"><div class="ai-file-icon">${fileIconSvg(p.ext)}</div><div class="ai-file-info"><div class="ai-file-name">${escH(p.fileName)}</div><div class="ai-file-size">${fmtBytes(bytes)} · .${p.ext}</div></div><button class="ai-file-dl" data-fileid="${id}">Скачать</button></div>`;
    }
  });
  let html='';
  if(textParts.trim())html+=renderMd(textParts.trim());
  if(fileCards)html+=`<div class="ai-file-list">${fileCards}</div>`;
  return html;
}
document.addEventListener('click',e=>{
  const btn=e.target.closest('.ai-file-dl');
  if(!btn)return;
  const f=window._sharedFiles[btn.dataset.fileid];
  if(!f)return;
  const blob=new Blob([f.content],{type:'text/plain;charset=utf-8'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');a.href=url;a.download=f.fileName;a.style.display='none';
  document.body.appendChild(a);a.click();document.body.removeChild(a);
  setTimeout(()=>URL.revokeObjectURL(url),3000);
});

const AI_ICON=`<svg viewBox="0 0 48 48"><defs><linearGradient id="aig" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#4285f4"/><stop offset="33%" stop-color="#ea4335"/><stop offset="66%" stop-color="#fbbc04"/><stop offset="100%" stop-color="#34a853"/></linearGradient></defs><path d="M24 2C24 14 34 24 46 24C34 24 24 34 24 46C24 34 14 24 2 24C14 24 24 14 24 2Z" fill="url(#aig)"/></svg>`;

function renderState(icon,title,sub){
  document.getElementById('root').innerHTML=`<div class="state"><div class="ico">${icon}</div><h2>${escH(title)}</h2><p>${escH(sub)}</p></div>`;
}
function renderLoading(){
  document.getElementById('root').innerHTML=`<div class="state"><div class="spinner"></div><h2>Загружаем чат...</h2></div>`;
}

async function main(){
  renderLoading();
  const SB_URL='https://wkuxcniydsvejcbgpfml.supabase.co';
  const SB_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6IndrdXhjbml5ZHN2ZWpjYmdwZm1sIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzMzMTEzODcsImV4cCI6MjA4ODg4NzM4N30.8DkwWOLfim_lGFk9EORn4t_cMpscGxEgsSMFwBLkfxo';

  const pathParts=location.pathname.split('/').filter(Boolean);
  const shareId=pathParts[pathParts.length-1]||new URLSearchParams(location.search).get('id');
  if(!shareId){renderState('🔗','Ссылка не найдена','В адресе нет идентификатора чата.');return;}

  try{
    const r=await fetch(`${SB_URL}/rest/v1/shared_chats?id=eq.${encodeURIComponent(shareId)}&select=*`,{
      headers:{apikey:SB_KEY,Authorization:'Bearer '+SB_KEY}
    });
    const rows=await r.json();
    if(!Array.isArray(rows)||!rows.length){renderState('🚫','Чат не найден','Ссылка недействительна или чат был удалён.');return;}
    const chat=rows[0];
    const messages=Array.isArray(chat.messages)?chat.messages:[];

    fetch(`${SB_URL}/rest/v1/rpc/increment_share_view`,{
      method:'POST',headers:{apikey:SB_KEY,Authorization:'Bearer '+SB_KEY,'Content-Type':'application/json'},
      body:JSON.stringify({share_id:shareId})
    }).catch(()=>{});

    let html=`<div class="head"><h1>${escH(chat.title||'Чат FernieX')}</h1><div class="sub">Поделённая переписка · только для чтения</div></div><div class="msgs">`;
    messages.forEach(m=>{
      if(m.role==='user'){
        html+=`<div class="msg-u">${escH(m.content||'')}</div>`;
      } else if(m.role==='assistant'){
        html+=`<div class="msg-ai"><div class="msg-ai-ico">${AI_ICON}</div><div class="msg-ai-txt">${renderAiContent(m.content||'')}</div></div>`;
      }
    });
    html+=`</div>`;
    document.getElementById('root').innerHTML=html;
  }catch(e){
    renderState('⚠️','Ошибка загрузки',e.message||'Не удалось получить данные чата.');
  }
}
main();
</script>
</body>
</html>
